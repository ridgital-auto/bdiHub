<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bdiHub — Kumpulan Link Web App</title>
<meta name="description" content="Dashboard kumpulan link web app, dikelompokkan per proyek">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.svg" alt="bdiHub" class="logo-img">
    <div>
      <h1>bdiHub</h1>
      <p>Link web app per proyek</p>
    </div>
  </div>
  <div class="actions">
    <div id="authArea"></div>
    <button id="btnAddProject" class="btn">＋ Proyek</button>
    <button id="btnAdd" class="btn primary">＋ Tambah Link</button>
    <div class="menu-wrap">
      <button id="btnMenu" class="btn ghost" title="Pengaturan">⚙️</button>
      <div id="menu" class="dropdown hidden">
        <button id="btnManageProjects">📁 Kelola proyek</button>
        <button id="btnSyncNow">🔄 Sinkronkan sekarang</button>
        <button id="btnExport">⬇️ Export data (JSON)</button>
        <button id="btnImport">⬆️ Import data (JSON)</button>
        <button id="btnReset" class="danger">🗑️ Reset semua data</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 Cari link atau deskripsi…" autocomplete="off">
    <div id="chips" class="chips"></div>
  </div>

  <div id="empty" class="empty hidden">
    <div class="empty-icon">📭</div>
    <h2 id="emptyTitle">Belum ada link</h2>
    <p id="emptyText">Tambahkan link web app pertama kamu lewat tombol <b>＋ Tambah Link</b>.</p>
  </div>

  <div id="grid" class="grid"></div>
</main>

<footer>
  <p>bdiHub • data tersimpan otomatis di browser ini • backup rutin lewat Export JSON 💾</p>
</footer>

<!-- Modal tambah / edit link -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle">Tambah Link</h2>
    <p id="modalSub" class="modal-sub"></p>
    <form id="form" autocomplete="off">
      <label>Nama link <span>*</span>
        <input id="fName" type="text" required maxlength="80" placeholder="cth: Puskesdoc Generator">
      </label>
      <label>URL <span>*</span>
        <input id="fUrl" type="text" required inputmode="url" placeholder="https://…">
      </label>
      <label>Deskripsi
        <textarea id="fDesc" rows="2" maxlength="200" placeholder="Keterangan singkat (opsional)"></textarea>
      </label>
      <div class="row2">
        <label>Proyek
          <select id="fProject"></select>
        </label>
        <label class="check">
          <input id="fPin" type="checkbox"> 📌 Sematkan (pin)
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" id="btnCancel" class="btn ghost">Batal</button>
        <button type="submit" class="btn primary">💾 Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal tambah / edit proyek -->
<div id="pmodal" class="modal hidden">
  <div class="modal-card">
    <h2 id="pmodalTitle">Tambah Proyek</h2>
    <form id="pform" autocomplete="off">
      <label>Nama proyek <span>*</span>
        <input id="pName" type="text" required maxlength="60" placeholder="cth: Kerja Puskesmas">
      </label>
      <label>Deskripsi
        <textarea id="pDesc" rows="2" maxlength="200" placeholder="Keterangan singkat (opsional)"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="pbtnCancel" class="btn ghost">Batal</button>
        <button type="submit" class="btn primary">💾 Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal kelola proyek -->
<div id="mmodal" class="modal hidden">
  <div class="modal-card wide">
    <h2>Kelola Proyek</h2>
    <div id="projectList" class="project-list"></div>
    <div class="modal-actions">
      <button id="mbtnClose" class="btn primary">Tutup</button>
    </div>
  </div>
</div>

<input id="fileInput" type="file" accept="application/json" hidden>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
